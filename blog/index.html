<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Celebrity Telegraph — Your Daily Global Update</title>
<meta name="description" content="Celebrity Telegraph: breaking news, business, celebrity, politics, tech, science, health, music and gospel from Nigeria, Africa and the world.">
<link rel="icon" href="/logo.png">
<meta property="og:title" content="Celebrity Telegraph"><meta property="og:description" content="Your Daily Global Update — Nigeria, Africa, The World."><meta property="og:type" content="website"><meta property="og:image" content="/logo.png">
<style>body{margin:0;font:16px/1.6 Inter,Arial,sans-serif;background:#071120;color:#F4F7FB}header{background:#0A1626;padding:20px 16px;border-bottom:2px solid #E8A020}header h1{margin:0;font:800 22px Arial}header h1 b{color:#FFB81C}header p{margin:6px 0 0;font:600 10px Arial;letter-spacing:2px;color:#9FB0C7}.wrap{max-width:720px;margin:0 auto;padding:0 16px}#q{width:100%;box-sizing:border-box;margin:18px 0;padding:13px;border-radius:12px;border:1px solid #1D2E4D;background:#0E1B2E;color:#fff;font-size:15px}.post{display:block;background:#0E1B2E;border:1px solid #1D2E4D;border-radius:14px;padding:16px;margin-bottom:12px;text-decoration:none}.post h2{margin:0 0 6px;font:800 17px/1.35 Arial;color:#fff}.post p{margin:0 0 8px;color:#9FB0C7;font-size:14px}.post small{color:#9FB0C7}footer{color:#9FB0C7;font:12px Arial;padding:20px 16px 40px;text-align:center}a{color:inherit}</style>
</head><body>
<header><div class="wrap"><h1>CELEBRITY <b>TELEGRAPH</b></h1><p>YOUR DAILY GLOBAL UPDATE • NIGERIA • AFRICA • THE WORLD</p></div></header>
<main class="wrap">
<input id="q" placeholder="🔍 Search Celebrity Telegraph…">
<div id="list"><p>Loading latest stories…</p></div>
</main>
<footer>© Celebrity Telegraph • Breaking News • Business • Celebrity • Politics • Tech • Science • Health • Music • Gospel</footer>
<script>
let posts=[];
fetch('index.json').then(r=>r.ok?r.json():[]).then(a=>{posts=a;draw(a)}).catch(()=>{document.getElementById('list').innerHTML='<p>No posts yet.</p>'});
function esc(s){return String(s).replace(/&/g,'&').replace(/</g,'<')}
function draw(a){document.getElementById('list').innerHTML=a.length?a.map(p=>'<a class="post" href="'+p.url+'"><h2>'+esc(p.title)+'</h2><p>'+esc(p.desc||'')+'</p><small>'+new Date(p.date).toUTCString().slice(0,22)+' GMT'+(p.source?' • via '+esc(p.source):'')+'</small></a>').join(''):'<p>No posts yet — publish from the Newsroom Desk.</p>'}
document.getElementById('q').addEventListener('input',e=>{const q=e.target.value.toLowerCase();draw(posts.filter(p=>((p.title||'')+' '+(p.desc||'')).toLowerCase().includes(q)))});
</script>
</body></html>
