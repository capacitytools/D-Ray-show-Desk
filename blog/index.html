<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>D-Ray Show Blog News — Your Daily Global Update</title>
<meta name="description" content="D-Ray Show Blog News: breaking news, politics, sports and current happenings from Nigeria, Africa and the world. Latest updates, global coverage, unbiased reporting.">
<link rel="icon" href="/logo.png">
<meta property="og:title" content="D-Ray Show Blog News"><meta property="og:description" content="Your Daily Global Update — breaking news from Nigeria, Africa and the world."><meta property="og:type" content="website"><meta property="og:image" content="/logo.png">
<style>body{margin:0;font:16px/1.6 Inter,Arial,sans-serif;background:#F5F7FB;color:#101828}header{background:#0A1220;color:#fff;padding:20px 16px}header h1{margin:0;font:800 22px Arial}header h1 b{color:#E53935}header p{margin:6px 0 0;font:600 10px Arial;letter-spacing:2px;color:#9FB0C7}.wrap{max-width:720px;margin:0 auto;padding:0 16px}#q{width:100%;box-sizing:border-box;margin:18px 0;padding:13px;border-radius:12px;border:1px solid #D5DCE8;font-size:15px}.post{display:block;background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;text-decoration:none;box-shadow:0 2px 8px rgba(16,24,64,.07)}.post h2{margin:0 0 6px;font:800 17px/1.35 Arial;color:#101828}.post p{margin:0 0 8px;color:#5A6B85;font-size:14px}.post small{color:#8A97AB}footer{color:#8A97AB;font:12px Arial;padding:20px 16px 40px;text-align:center}</style>
</head><body>
<header><div class="wrap"><h1>D RAY <b>SHOW</b> BLOG NEWS</h1><p>YOUR DAILY GLOBAL UPDATE • LATEST UPDATES. GLOBAL COVERAGE. UNBIASED REPORTING.</p></div></header>
<main class="wrap">
<input id="q" placeholder="🔍 Search D-Ray Show Blog News…">
<div id="list"><p>Loading latest stories…</p></div>
</main>
<footer>© D-Ray Show Blog News • IG @dray.show • X @show_ray2026 • YT @drayshow-politicssport</footer>
<script>
let posts=[];
fetch('index.json').then(r=>r.ok?r.json():[]).then(a=>{posts=a;draw(a)}).catch(()=>{document.getElementById('list').innerHTML='<p>No posts yet.</p>'});
function esc(s){return String(s).replace(/&/g,'&').replace(/</g,'<')}
function draw(a){document.getElementById('list').innerHTML=a.length?a.map(p=>'<a class="post" href="'+p.url+'"><h2>'+esc(p.title)+'</h2><p>'+esc(p.desc||'')+'</p><small>'+new Date(p.date).toUTCString().slice(0,22)+' GMT'+(p.source?' • via '+esc(p.source):'')+'</small></a>').join(''):'<p>No posts yet — publish from the Newsroom Desk.</p>'}
document.getElementById('q').addEventListener('input',e=>{const q=e.target.value.toLowerCase();draw(posts.filter(p=>((p.title||'')+' '+(p.desc||'')).toLowerCase().includes(q)))});
</script>
</body></html>
