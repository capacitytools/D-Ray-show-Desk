function parseAI(txt){

const marks=[];
for(const k of keys){

 const m=re.exec(t);
 if(m)marks.push({k,s:m.index,e:m.index+m[0].length});
}
if(marks.length<2)return null;
marks.sort((a,b)=>a.s-b.s);
const obj={};
for(let i=0;i<marks.length;i++){
 const start=marks[i].e;

 obj[marks[i].k]=t.slice(start,end);
}
return obj;
}

async function publishToBlog(title,bodyText,source,o){
o=o||{};
const repo=state.ghRepo.trim()||'server';const slug=o.edit?o.edit.id:((title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60)||'post')+'-'+Date.now().toString(36));
let img=(o.edit&&o.edit.img)?o.edit.img:'';
if(o.imgB64){await ghUpsert(repo,'blog/img/'+slug+'.jpg',o.imgB64,'Image: '+title);img=location.origin+'/blog/img/'+slug+'.jpg'}
const desc=bodyText.replace(/\s+/g,' ').slice(0,160);
const url=location.origin+'/blog/'+slug+'.html';
await ghUpsert(repo,'blog/'+slug+'.html',b64t(blogHTML({title,desc,source,img,body:bodyText,url})),'Publish: '+title);
const meta=await ghGetMeta(repo,'blog/index.json');
let idx=[];if(meta&&meta.content){try{idx=JSON.parse(decodeURIComponent(escape(atob(meta.content.replace(/\n/g,'')))))}catch(e){}}
const old=idx.find(pp=>pp.id===slug);
const entry={id:slug,title,desc,source:source||'D-Ray Show',img,date:old?old.date:new Date().toISOString(),url,body:bodyText};
if(old)idx[idx.indexOf(old)]=entry;else idx.unshift(entry);
await ghUpsert(repo,'blog/index.json',b64t(JSON.stringify(idx,null,1)),'Update blog index');
loadBlog();
return url}
