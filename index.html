function parse(xml){
 var items=[];var m;var re=/<item[\\s\\S]*?<\\/item>/g;
 while((m=re.exec(xml))){var b=m[0];var link=grab(b,'link');if(link)items.push({title:grab(b,'title'),link:link,pub:grab(b,'pubDate')})}

 return items;

const MASTER=`You are the Senior Breaking News Editor for D-RAY SHOW ("Your Daily Global Update"), a media house covering sports, politics and current happenings worldwide.CORE RULES:
- Treat the source text ONLY as facts. Rebuild the story from scratch (WHO/WHAT/WHERE/WHEN/WHY/HOW). Never copy sentences, phrases or paragraph order from the source.

function parseXML(t){const xml=new DOMParser().parseFromString(t,'text/xml');return[...xml.querySelectorAll('item')].map(n=>({title:(n.querySelector('title')||{}).textContent||'',link:(n.querySelector('link')||{}).textContent||'',pub:(n.querySelector('pubDate')||{}).textContent||''}))}
function fetchT(url,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(url,{signal:c.signal}).finally(()=>clearTimeout(t))}
async function pull(f){
const attempts=[
 (async()=>{const r=await fetchT('https://api.allorigins.win/raw?url='+encodeURIComponent(f.url),9000);if(!r.ok)throw 0;return parseXML(await r.text())})(),
 (async()=>{const r=await fetchT('https://api.allorigins.win/get?url='+encodeURIComponent(f.url),9000);const d=await r.json();if(!d.contents)throw 0;return parseXML(d.contents)})(),
 (async()=>{const r=await fetchT('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(f.url),9000);const d=await r.json();if(!d.items)throw 0;return d.items.map(x=>({title:x.title,link:x.link,pub:x.pubDate}))})(),
 (async()=>{const r=await fetchT('https://corsproxy.io/?url='+encodeURIComponent(f.url),9000);if(!r.ok)throw 0;return parseXML(await r.text())})(),

state.scanning=true;if(state.view==='dash')render();
const items=await gather();
/* AUTO-HEAL: relay missing/broken + GitHub saved → install it ourselves */
if((state.relayCode===404||state.relayCode===500)&&state.ghToken.trim()&&state.ghRepo.trim()&&!state.healed){
 state.healed=true;
 toast('🛠 Relay missing — auto-installing…');
 ghUpsert(state.ghRepo.trim(),'api/feeds.js',b64t(RELAY_CODE),'Auto-install D-Ray news relay')
  .then(()=>{toast('✅ Relay installed — rescanning in 30s');setTimeout(checkFeeds,30000)})
  .catch(er=>toast('⚠️ Auto-install failed: '+er.message));
}
const fresh=items.filter(i=>{const ts=i.pub?new Date(i.pub).getTime():0;return!ts||(Date.now()-ts)<=86400000});
const use=fresh.length?fresh:items.slice(0,20);
let add=0;
for(const n of use){
 let title=n.title;const link=n.link;if(!link||!title)continue;
 let src=n.src||n.name||'World';
 if(n.goog){const parts=title.split(' - ');if(parts.length>1){src=parts.pop().trim();title=parts.join(' - ')}}
 const id=hash(link);
 if(state.seen.includes(id))continue;
 state.seen.push(id);
 const ts=n.pub?new Date(n.pub).getTime():Date.now();
 state.arrived.push({id,title,link,source:src,flag:n.flag,country:n.country||n.name||'World',region:n.region,ts});
 add++;
}
state.seen=state.seen.slice(-500);localStorage.setItem('drs_seen',JSON.stringify(state.seen));
state.arrived.sort((a,b)=>b.ts-a.ts).splice(60);
/* PERMANENT MEMORY: never lose the Desk again */if(state.arrived.length)localStorage.setItem('drs_cache',JSON.stringify(state.arrived.slice(0,30)));
state.lastScan=Date.now();state.scanning=false;
if(add>0){toast('🟢 '+add+' new stories added to the Desk');beep()}
if(!state.arrived.length){loadSamples();toast('⚠️ Every route blocked on this network — samples loaded')}
if(state.view==='dash'||state.view==='alerts')render()}

async function aiCall(userMsg){
const p=prov();let lastErr='';
for(const m of p.models){
 try{
  const res=await fetch(p.url,{method:'POST',headers:{'Authorization':'Bearer '+state.apiKey.trim(),'Content-Type':'application/json'},body:JSON.stringify({model:m,temperature:0.5,messages:[{role:'system',content:MASTER},{role:'user',content:userMsg}]})});
  if(res.ok){const d=await res.json();return{text:d.choices[0].message.content,model:m,prov:p.name}}
  const body=await res.text();
  lastErr=p.name+' '+m+' → HTTP '+res.status+': '+body.slice(0,140);
  if(res.status===401||res.status===403)throw new Error('Key rejected by '+p.name+' ('+res.status+'). Re-paste the correct key in Settings.');
 }catch(e){ if(String(e.message).includes('Key rejected'))throw e; lastErr=String(e).slice(0,140);}
}
throw new Error(lastErr||'All AI models failed');
}

const cleanVal=s=>String(s||'').trim().replace(/^["'`*]+/,'').replace(/["'`*]+$/,'').replace(/\\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
const LAB=/^(BREAKING NEWS HEADLINE|SUBHEAD|THE NEWS|KEY DETAIL|CONTEXT|RESPONSE|WHY IT MATTERS|FINAL)\s*:\s*/i;
function stripBlog(s){return String(s||'').split('\n').map(L=>L.replace(LAB,'')).filter(L=>!/^(SEO TITLE|META DESCRIPTION|KEYWORDS)\s*:/i.test(L)).join('\n').replace(/\n{3,}/g,'\n\n').trim()}
function parseAI(txt){
let t=txt.trim();
if(t.startsWith('```')){t=t.replace(/^```[a-z]*\n?/,'').replace(/```$/,'').trim()}
try{
 const s=t.indexOf('{'),e=t.lastIndexOf('}');
 if(s>-1&&e>s)return JSON.parse(t.slice(s,e+1));
}catch(e){}
const keys=['title','fb','tw','vo','cm','full','ip'];
const marks=[];
for(const k of keys){
 const re=new RegExp('["\'\\*\\s\\n{,]*'+k+'["\'\\*]*\\s*:','i');
 const m=re.exec(t);
 if(m)marks.push({k,s:m.index,e:m.index+m[0].length});
}
if(marks.length<2)return null;
marks.sort((a,b)=>a.s-b.s);
const obj={};
for(let i=0;i<marks.length;i++){
 const start=marks[i].e;
 const end=i+1<marks.length?marks[i+1].s:t.length;
 obj[marks[i].k]=t.slice(start,end);
}
return obj;
}

async function gen(id,angle){
if(!state.apiKey)return toast('⚠️ Add your Grok/Groq API key in Settings first');
const it=state.arrived.find(x=>x.id===id);if(!it||it.busy)return;
it.busy=true;it.error=false;render();
try{
 if(!it.raw){try{const j=await fetch('https://r.jina.ai/'+it.link);it.raw=(await j.text()).slice(0,9000)}catch(e){}}
 const userMsg=(angle?'REGENERATE with a clearly different angle (human vs institutional). Previous FB version to differ from:\n'+((state.out[id]&&state.out[id].fb)||'')+'\n\n':'')+'SOURCE: '+it.source+'\nHEADLINE: '+it.title+'\nFULL TEXT:\n'+(it.raw||it.title);
 const r=await aiCall(userMsg);
 state.lastModel=r.prov+' / '+r.model;
 let out=parseAI(r.text)||{title:it.title,fb:r.text};
 ['title','fb','tw','vo','cm','full','ip'].forEach(k=>out[k]=cleanVal(out[k]));
 out.full=stripBlog(out.full);
 if(!out.title)out.title=it.title;
 if(!out.fb)out.fb=out.title;
 if(out.tw&&out.tw.length>280)out.tw=out.tw.slice(0,277).replace(/\s+\S*$/,'')+'…'; state.out[id]=out;
 it.busy=false;toast(angle?'⟳ Fresh angle ready ('+r.model+')':'⚡ Generated via '+r.model);render();
}catch(e){
 it.busy=false;it.error=true;
 state.out[id]={fb:'⚠️ Generation failed: '+e.message+' — open Settings, tap 🩺 TEST KEY and screenshot the log.',tw:'',vo:'',cm:'',full:'',ip:''};render();
}}

function ghAuth(){return{'Authorization':'token '+state.ghToken.trim(),'Accept':'application/vnd.github+json'}}
async function ghGetMeta(repo,path){try{const r=await fetch('https://api.github.com/repos/'+repo+'/contents/'+path,{headers:ghAuth()});if(!r.ok)return null;return await r.json()}catch(e){return null}}
async function ghUpsert(repo,path,b64,msg){
const meta=await ghGetMeta(repo,path);
const body={message:msg,content:b64};
if(meta&&meta.sha)body.sha=meta.sha;
const r=await fetch('https://api.github.com/repos/'+repo+'/contents/'+path,{method:'PUT',headers:{...ghAuth(),'Content-Type':'application/json'},body:JSON.stringify(body)});
if(!r.ok){const t=await r.text();throw new Error('GitHub '+r.status+' '+t.slice(0,90))}
return r.json()}
function fileToB64(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,1200/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.82).split(',')[1])};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

async function publishToBlog(title,bodyText,source,o){
o=o||{};
const repo=state.ghRepo.trim();
if(!state.ghToken.trim()||!repo)throw new Error('Add GitHub token + repo in Settings first');
const slug=o.edit?o.edit.id:((title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60)||'post')+'-'+Date.now().toString(36));
let img=(o.edit&&o.edit.img)?o.edit.img:'';
if(o.imgB64){await ghUpsert(repo,'blog/img/'+slug+'.jpg',o.imgB64,'Image: '+title);img=location.origin+'/blog/img/'+slug+'.jpg'}
const desc=bodyText.replace(/\s+/g,' ').slice(0,160);
const url=location.origin+'/blog/'+slug+'.html';
await ghUpsert(repo,'blog/'+slug+'.html',b64t(blogHTML({title,desc,source,img,body:bodyText,url})),'Publish: '+title);
const meta=await ghGetMeta(repo,'blog/index.json');
let idx=[];if(meta&&meta.content){try{idx=JSON.parse(decodeURIComponent(escape(atob(meta.content.replace(/\n/g,'')))))}catch(e){}}
const old=idx.find(pp=>pp.id===slug);
const entry={id:slug,title,desc,source:source||'D-Ray Show',img,date:old?old.date:new Date().toISOString(),url,body:bodyText};
if(old)idx[idx.indexOf(old)]=entry;else idx.unshift(entry);
await ghUpsert(repo,'blog/index.json',b64t(JSON.stringify(idx,null,1)),'Update blog index');
loadBlog();
return url}

document.addEventListener('click',e=>{
const b=e.target.closest('[data-act]');if(!b)return;const d=b.dataset;
if(d.act==='login'){const u=$('#user').value.trim().toLowerCase(),p=$('#pin').value;
 if(USERS[u]&&USERS[u].pin===p){state.user=u;state.role=USERS[u].role;localStorage.setItem('drs_user',u);localStorage.setItem('drs_role',USERS[u].role);$('#login').style.display='none';start();}
 else toast('❌ Invalid username or PIN');return}if(d.act==='nav'){state.view=d.v;if(d.v==='blog')loadBlog();render();return}
if(d.act==='refresh'){toast('🔄 Scanning all channels…');checkFeeds();return}
if(d.act==='gen'){gen(d.id,false);return}
if(d.act==='regen'){gen(d.id,true);return}
if(d.act==='tab'){state.tab[d.id]=d.t;render();return}
if(d.act==='copy'){navigator.clipboard.writeText(state.out[d.id][state.tab[d.id]||'fb']).then(()=>toast('✅ Copied!'));return}
if(d.act==='copyraw'){navigator.clipboard.writeText(state.drafts[d.i].out[d.t]).then(()=>toast('✅ Copied!'));return}
if(d.act==='save'){const it=state.arrived.find(x=>x.id===d.id);state.drafts.unshift({title:it.title,source:it.source,ts:fmt(it.ts),out:state.out[it.id]});localStorage.setItem('drs_drafts',JSON.stringify(state.drafts));toast('💾 Saved to Drafts');render();return}
if(d.act==='publish'){const it=state.arrived.find(x=>x.id===d.id);const o=state.out[d.id];
 if(!o||!o.full)return toast('⚡ Generate first — Full Article tab');
 toast('📤 Publishing…');
 publishToBlog(o.title||it.title,o.full,it.source).then(()=>toast('🚀 LIVE! Link in Blog tab')).catch(er=>toast('⚠️ '+er.message));return}
if(d.act==='compose'){state.composing=!state.composing;if(!state.composing){state.editing=null;state.pendingImg=null}render();return}
if(d.act==='pubmanual'){const t=$('#cTitle').value.trim(),bo=stripBlog($('#cBody').value.trim()),so=$('#cSource').value.trim();
 if(!t||!bo)return toast('⚠️ Title + story required');
 toast('📤 Publishing…');
 publishToBlog(t,bo,so||'D-Ray Show',{imgB64:state.pendingImg,edit:state.editing}).then(()=>{state.composing=false;state.editing=null;state.pendingImg=null;toast('🚀 LIVE! Link in Blog tab');render()}).catch(er=>toast('⚠️ '+er.message));return}
if(d.act==='blogrefresh'){loadBlog();return}
if(d.act==='blogcopy'){navigator.clipboard.writeText(state.blog[d.i].url).then(()=>toast('🔗 Link copied!'));return}
if(d.act==='blogshare'){const p=state.blog[d.i];if(navigator.share)navigator.share({title:p.title,url:p.url}).catch(()=>{});else navigator.clipboard.writeText(p.url).then(()=>toast('🔗 Link copied!'));return}
if(d.act==='blogopen'){window.open(state.blog[d.i].url,'_blank');return}
if(d.act==='blogedit'){state.editing=state.blog[d.i];state.composing=true;state.pendingImg=null;render();window.scrollTo(0,0);return}
if(d.act==='installrelay'){
 if(!state.ghToken.trim()||!state.ghRepo.trim())return toast('⚠️ Save GitHub token + repo first');
 toast('🛠 Installing relay…');
 ghUpsert(state.ghRepo.trim(),'api/feeds.js',b64t(RELAY_CODE),'Install D-Ray news relay').then(()=>toast('✅ Relay installed — wait ~20s for Vercel, then 🔄')).catch(er=>toast('⚠️ '+er.message));return}
if(d.act==='testfeeds'){testFeeds();return}
if(d.act==='savekey'){state.apiKey=$('#keyInput').value.trim();localStorage.setItem('drs_key',state.apiKey);toast('✅ Key saved — detected: '+(state.apiKey.startsWith('gsk_')?'Groq':'xAI Grok'));return}
if(d.act==='savegh'){state.ghToken=$('#ghToken').value.trim();state.ghRepo=$('#ghRepo').value.trim();localStorage.setItem('drs_gh',state.ghToken);localStorage.setItem('drs_repo',state.ghRepo);toast('✅ GitHub saved');return}
if(d.act==='testkey'){testKey();return}
if(d.act==='logout'){localStorage.removeItem('drs_user');localStorage.removeItem('drs_role');location.reload();return}
if(d.act==='sample'){loadSamples();return}
});
document.addEventListener('change',e=>{
if(e.target.dataset&&e.target.dataset.set==='sound')state.sound=e.target.checked;
if(e.target.id==='cImg'&&e.target.files&&e.target.files[0]){toast('🖼 Preparing image…');fileToB64(e.target.files[0]).then(b=>{state.pendingImg=b;toast('🖼 Image attached');render()}).catch(()=>toast('⚠️ Image failed — try another'))}
});
$('#region').addEventListener('change',e=>{state.region=e.target.value;render()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
let started=false;
function start(){if(started)return;started=true;render();checkFeeds();loadBlog();setInterval(checkFeeds,180000)}
if(state.user){$('#login').style.display='none';start()}
</script>
</body>
