<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A1220">
<link rel="manifest" href="manifest.json">
<title>D-Ray Show — Breaking News Desk</title>
<style>
:root{--blue:#1E5AA8;--blue2:#3F8EDC;--red:#D32F2F;--red2:#E53935;--bg:#0A1220;--card:#101E36;--line:#1D2E4D;--green:#22C55E;--txt:#F4F7FB;--mut:#9FB0C7}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.55 Inter,system-ui,sans-serif;padding-bottom:84px}
#login{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
#login h1{font:800 26px Montserrat,Inter;letter-spacing:.5px}#login h1 b{color:var(--red2)}
#login p{color:var(--mut);font:600 10px Inter;letter-spacing:2px;margin:4px 0 22px}
input{background:#122442;color:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;max-width:300px;margin-bottom:10px;font:600 15px Inter}
header{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:8px;padding:10px 12px;background:#0D1930ee;border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand h1{font:800 16px Montserrat,Inter;letter-spacing:.4px}.brand h1 b{color:var(--red2)}
.brand span{display:block;font:600 8.5px Inter;color:var(--mut);letter-spacing:1.6px}
select,.hbtn{background:#122442;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:600 13px Inter}
main{max-width:640px;margin:0 auto;padding:14px 12px}
.scanline{color:var(--mut);font:600 11px Inter;margin:0 2px 12px}
.card{background:linear-gradient(180deg,#132544,#0E1C36);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.ready{display:inline-flex;align-items:center;gap:7px;font:800 11px Inter;letter-spacing:1.2px;color:var(--green);border:1.5px solid var(--green);border-radius:20px;padding:4px 11px;margin-bottom:9px}
.ready.errb{color:var(--red2);border-color:var(--red2)}
.ready.busyb{color:var(--blue2);border-color:var(--blue2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.spinner{width:14px;height:14px;border:2.5px solid var(--blue2);border-bottom-color:transparent;border-radius:50%;display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card h3{font:800 17px/1.3 Montserrat,Inter;margin-bottom:6px}
.meta{color:var(--mut);font:600 12px Inter;margin-bottom:11px}
.chipS{color:#F5B841;border:1px solid #F5B841;border-radius:8px;padding:1px 6px;font-size:10px}
.btns{display:flex;gap:9px;flex-wrap:wrap}
.gen{background:linear-gradient(180deg,var(--red2),var(--red));color:#fff;border:0;border-radius:22px;padding:10px 20px;font:800 13px Inter;box-shadow:0 4px 14px #d32f2f55}
.re{background:#E8EDF4;color:#122442;border:0;border-radius:22px;padding:10px 16px;font:800 13px Inter}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0 8px}
.tab{flex:0 0 auto;background:#122442;border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:7px 11px;font:700 11.5px Inter}
.tab.on{background:var(--blue);border-color:var(--blue2);color:#fff;box-shadow:0 0 12px #3f8edc66}
.out{background:#0B1830;border:1px solid var(--line);border-radius:12px;padding:12px;white-space:pre-wrap;font:400 13.5px/1.6 Inter;color:#DCE6F5;max-height:340px;overflow-y:auto}
.row{display:flex;justify-content:space-between;align-items:center;margin:8px 0 6px}
.copy{background:#BFD9F7;color:#0B2547;border:0;border-radius:16px;padding:6px 14px;font:800 11px Inter}
.save{background:none;border:1px solid var(--line);color:var(--mut);border-radius:16px;padding:6px 12px;font:700 11px Inter}
.credit{text-align:right;color:var(--mut);font:600 11.5px Inter;margin-top:7px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0D1930f2;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 11px;font:600 10.5px Inter;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button i{font-style:normal;font-size:17px}
nav button.on{color:var(--blue2)}.grp{font:800 12px Inter;letter-spacing:1.4px;color:var(--blue2);margin:16px 4px 8px}
.src{display:flex;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;font:600 13px Inter}
.src em{color:var(--mut);font-style:normal;font-size:11px;white-space:nowrap}
.set{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;font:600 13px Inter;display:flex;justify-content:space-between;align-items:center}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#0F2C1B;border:1px solid var(--green);color:#C9F5D8;border-radius:12px;padding:9px 16px;font:700 12.5px Inter;z-index:120;display:none;max-width:92vw}
.empty{color:var(--mut);text-align:center;padding:40px 10px;font:600 13px Inter}
</style>
</head>
<body>

<div id="login">
<svg width="60" height="66" viewBox="0 0 60 66" style="margin-bottom:12px"><defs><linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3F8EDC"/><stop offset="1" stop-color="#1E5AA8"/></linearGradient><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E53935"/><stop offset="1" stop-color="#C62828"/></linearGradient></defs><path d="M30 2 56 10v22c0 16-11 27-26 32C15 59 4 48 4 32V10Z" fill="#123061"/><path d="M30 6 52 13v19c0 13-9 23-22 28Z" fill="url(#gr)"/><path d="M30 6 8 13v19c0 13 9 23 22 28Z" fill="url(#gb)"/><path d="M36 2 24 30h7l-5 30 15-34h-8Z" fill="#fff" opacity=".9"/><text x="27" y="44" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#fff" text-anchor="middle">R</text></svg>
<h1>D RAY <b>SHOW</b></h1>
<p>YOUR DAILY GLOBAL UPDATE</p>
<input id="user" placeholder="Username (admin1 / editor1)" autocomplete="username">
<input id="pin" type="password" placeholder="PIN" autocomplete="current-password">
<button class="gen" style="width:100%;max-width:300px" data-act="login">🔓 ENTER NEWSROOM</button>
<p style="margin-top:14px;font-size:11px">3 Admins • 2 Editors • Private Workspace</p>
</div>

<header>
<div class="brand">
<svg width="32" height="36" viewBox="0 0 60 66"><path d="M30 2 56 10v22c0 16-11 27-26 32C15 59 4 48 4 32V10Z" fill="#123061"/><path d="M30 6 52 13v19c0 13-9 23-22 28Z" fill="#E53935"/><path d="M30 6 8 13v19c0 13 9 23 22 28Z" fill="#3F8EDC"/><path d="M36 2 24 30h7l-5 30 15-34h-8Z" fill="#fff" opacity=".9"/><text x="27" y="44" font-family="Arial Black,Arial" font-size="26" font-weight="900" fill="#fff" text-anchor="middle">R</text></svg>
<div><h1>D RAY <b>SHOW</b></h1><span>YOUR DAILY GLOBAL UPDATE</span></div>
</div>
<select id="region"><option value="all">🌐 All</option><option value="world">🌍 World</option><option value="africa">🌍 Africa</option><option value="nigeria">🇳 Nigeria</option></select>
<button class="hbtn" data-act="refresh">🔄</button>
</header>

<div id="toast"></div>
<main id="view"></main>

<nav id="nav">
<button data-act="nav" data-v="dash" class="on"><i>📈</i>Desk</button>
<button data-act="nav" data-v="alerts"><i>🔔</i>Alerts</button>
<button data-act="nav" data-v="sources"><i>🌍</i>Sources</button>
<button data-act="nav" data-v="drafts"><i>📄</i>Drafts</button>
<button data-act="nav" data-v="set"><i>⚙️</i>Settings</button>
</nav>

<script>
const $=s=>document.querySelector(s);
const USERS={admin1:{pin:'1111',role:'Admin'},admin2:{pin:'2222',role:'Admin'},admin3:{pin:'3333',role:'Admin'},editor1:{pin:'4444',role:'Editor'},editor2:{pin:'5555',role:'Editor'}};
const state={user:localStorage.getItem('drs_user')||'',role:localStorage.getItem('drs_role')||'',view:'dash',region:'all',arrived:[],seen:JSON.parse(localStorage.getItem('drs_seen')||'[]'),out:{},tab:{},drafts:JSON.parse(localStorage.getItem('drs_drafts')||'[]'),apiKey:localStorage.getItem('drs_key')||'',sound:true,lastScan:null,sampled:false};
const esc=s=>String(s).replace(/&/g,'&').replace(/</g,'<');
const hash=s=>{let h=0;for(let i=0;i<s.length;i++){h=(h<<5)-h+s.charCodeAt(i);h|=0}return String(Math.abs(h))};
const fmt=ts=>new Date(ts).toUTCString().slice(17,22);
const ago=ts=>{const m=Math.max(0,Math.round((Date.now()-ts)/60000));if(m<1)return'just now';if(m<60)return m+'m ago';return Math.floor(m/60)+'h '+(m%60)+'m ago'};
function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',3800)}
function beep(){if(!state.sound)return;try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.18)}catch(e){}}
const MASTER=`You are the Senior Breaking News Editor for D-RAY SHOW ("Your Daily Global Update"), a media house covering sports, politics and current happenings worldwide.
CORE RULES:
- Treat the source text ONLY as facts. Rebuild the story from scratch (WHO/WHAT/WHERE/WHEN/WHY/HOW). Never copy sentences, phrases, headline structure or paragraph order from the source.
- Never invent facts, quotes, statistics or statements. If unverified, label it ("according to...", "the claim has not been independently verified").
- Lead with the most important confirmed development. Short punchy sentences for impact, longer for context. Professional human newsroom tone.
- BANNED phrases: "Furthermore", "Moreover", "In addition", "It is worth noting", "Interestingly", "In today's rapidly changing world", "This underscores".
- No clickbait, no sensationalism. Facts first, clarity second, engagement third.
- Deaths/crimes/disasters/allegations: respectful language, "police allege", "the suspect"; never present allegations as convictions.
CREDIT RULE (never skip): "📰 Credit: {Source Name}".
BRAND SIGN-OFF: "📺 D-Ray Show — Your Daily Global Update."
SOCIAL HANDLES to append at the end of social formats: IG @dray.show • X @show_ray2026 • YT @drayshow-politicssport
RETURN ONLY A VALID JSON OBJECT with exactly these 5 keys:
"fb": Facebook & Instagram post (Meta-policy safe): 🚨 hook line; 1-sentence lead; "What we know so far:" bullets (confirmed facts only); "What happens next:" line; credit line; brand sign-off; "Follow for updates as this story develops."; 3-5 relevant hashtags + #DRayShow. No engagement-bait, no hashtag spam.
"tw": X tweet, MAX 280 characters: one fact + one status line + "📰 via {Source}" + max 2 hashtags.
"vo": 30-second TikTok/YouTube voice-over script: spoken rhythm, short sentences, timecodes (0:00 hook / 0:08 detail / 0:16 status / 0:22 next / 0:27 outro), [ON SCREEN] cues with red BREAKING strap + country + logo bug, fixed outro "Follow D-Ray Show — your daily global update.", [END CARD: royal-blue frame, red stripe, tagline].
"cm": Commentary: blocks THE NEWS IN ONE LINE / WHY IT MATTERS / THE KEY QUESTION / OUR LINE AS A SHOW (balanced, label speculation, end on the D-Ray standard line).
"ip": AI image generation prompt, 4:5 vertical: scene built ONLY from confirmed facts; photorealistic editorial style graded in royal blue #1E5AA8 and signal red #D32F2F; top-left D-Ray shield logo watermark; top-right red BREAKING chip; bottom-third royal-blue banner with thin red stripe, bold white headline max 6 words + tagline "YOUR DAILY GLOBAL UPDATE"; no third-party logos, no identifiable faces; end with --ar 4:5.
REGENERATE rule: take a clearly different angle (human angle vs institutional angle), never a synonym swap.`;

const FEEDS=[
{region:'world',flag:'🌍',name:'World',url:'https://news.google.com/rss/search?q=breaking+news&hl=en-US&gl=US&ceid=US:en'},
{region:'africa',flag:'🌍',name:'Africa',url:'https://news.google.com/rss/search?q=breaking+news+africa&hl=en-US&gl=US&ceid=US:en'},
{region:'nigeria',flag:'🇳🇬',name:'Nigeria',url:'https://news.google.com/rss/search?q=breaking+news+nigeria&hl=en-US&gl=US&ceid=US:en'}];
const SOURCES={world:['Reuters','Associated Press','BBC Breaking','CNN','Al Jazeera','Sky News','Bloomberg','AFP','The Guardian','NBC News'],africa:['Africanews','News24 (SA)','SABC News','Daily Nation (KE)','Citizen Digital (KE)','KTN News (KE)','Daily Graphic (GH)','TimesLIVE (SA)','The Africa Report','Jeune Afrique'],nigeria:['Channels Television','Arise News','TVC News','Punch','Premium Times','The Cable']};

/* ---- RELIABLE FEED PULLER: 3 fallback routes ---- */
function parseXML(t){const xml=new DOMParser().parseFromString(t,'text/xml');return[...xml.querySelectorAll('item')].map(n=>({title:(n.querySelector('title')||{}).textContent||'',link:(n.querySelector('link')||{}).textContent||'',pub:(n.querySelector('pubDate')||{}).textContent||''}))}
async function pull(f){
const tries=[
 async()=>{const r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(f.url));if(!r.ok)throw 0;return parseXML(await r.text())},
 async()=>{const r=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(f.url));const d=await r.json();if(!d.items)throw 0;return d.items.map(x=>({title:x.title,link:x.link,pub:x.pubDate}))},
 async()=>{const r=await fetch('https://corsproxy.io/?url='+encodeURIComponent(f.url));if(!r.ok)throw 0;return parseXML(await r.text())}
];
for(const t of tries){try{const it=await t();if(it&&it.length)return it}catch(e){}}
return[]}

/* ---- SCAN: only last 60 minutes, time shown on every card ---- */
async function checkFeeds(){
let found=0;
for(const f of FEEDS){
 const items=(await pull(f)).slice(0,8);
 let fresh=items.filter(i=>!i.pub||(Date.now()-new Date(i.pub).getTime())<=3600000);
 if(!fresh.length)fresh=items.slice(0,3);
 for(const n of fresh){
  let title=n.title;const link=n.link;if(!link)continue;
  let src=f.name;const parts=title.split(' - ');
  if(parts.length>1){src=parts.pop().trim();title=parts.join(' - ')}
  const id=hash(link);
  if(state.seen.includes(id))continue;  state.seen.push(id);localStorage.setItem('drs_seen',JSON.stringify(state.seen));
  const ts=n.pub?new Date(n.pub).getTime():Date.now();
  state.arrived.unshift({id,title,link,source:src,flag:f.flag,country:f.name,region:f.region,ts});
  found++;
 }
}
state.seen=state.seen.slice(-300);localStorage.setItem('drs_seen',JSON.stringify(state.seen));
state.arrived=state.arrived.slice(0,40);
state.lastScan=Date.now();
if(found>0){toast('🟢 '+found+' new break'+(found>1?'s':'')+' in the last 60 min');beep()}
if(!state.arrived.length){loadSamples();toast('⚠️ Feeds quiet/unreachable — samples loaded so you can test')}
if(state.view==='dash'||state.view==='alerts')render()}

function loadSamples(){
if(state.sampled)return;state.sampled=true;
[{t:'Major earthquake strikes eastern Turkey',s:'Reuters',f:'🇹🇷',c:'Turkey',r:'world'},
{t:'CBN announces emergency measures as naira slides',s:'Channels Television',f:'🇳🇬',c:'Nigeria',r:'nigeria'},
{t:'Major fire breaks out at Nairobi market',s:'Citizen Digital',f:'🇰🇪',c:'Kenya',r:'africa'}]
.forEach(x=>state.arrived.unshift({id:'smp'+Math.random().toString(36).slice(2,8),title:x.t,link:'https://example.com/'+x.r,source:x.s,flag:x.f,country:x.c,region:x.r,ts:Date.now(),sample:true}));
render()}

/* ---- GROK (xAI) GENERATION ---- */
async function gen(id,angle){
if(!state.apiKey)return toast('⚠️ Add your Grok API key in Settings first');
const it=state.arrived.find(x=>x.id===id);if(!it||it.busy)return;
it.busy=true;it.error=false;render();
try{
 if(!it.raw){try{const j=await fetch('https://r.jina.ai/'+it.link);it.raw=(await j.text()).slice(0,9000)}catch(e){}}
 const userMsg=(angle?'REGENERATE with a clearly different angle (human vs institutional). Previous FB version to differ from:\n'+((state.out[id]&&state.out[id].fb)||'')+'\n\n':'')+'SOURCE: '+it.source+'\nHEADLINE: '+it.title+'\nFULL TEXT:\n'+(it.raw||it.title);
 const res=await fetch('https://api.x.ai/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+state.apiKey,'Content-Type':'application/json'},body:JSON.stringify({model:'grok-2-latest',temperature:0.5,response_format:{type:'json_object'},messages:[{role:'system',content:MASTER},{role:'user',content:userMsg}]})});
 if(!res.ok)throw new Error('API error '+res.status+' (check key/credits)');
 const data=await res.json();
 state.out[id]=JSON.parse(data.choices[0].message.content);
 it.busy=false;toast(angle?'⟳ Fresh angle ready':'⚡ Generated in D-Ray style');render();
}catch(e){
 it.busy=false;it.error=true;
 state.out[id]={fb:'⚠️ Generation failed: '+e.message+' — check your Grok key in Settings, then tap REGENERATE.',tw:'',vo:'',cm:'',ip:''};render();
}}

/* ---- UI ---- */
const TABS=[['fb','FB/IG Post'],['tw','X Tweet'],['vo','Voice-Over'],['cm','Commentary'],['ip','Image Prompt']];
function panelHTML(it){const t=state.tab[it.id]||'fb';
return `<div class="tabs">${TABS.map(([k,l])=>`<button class="tab ${t===k?'on':''}" data-act="tab" data-id="${it.id}" data-t="${k}">${l}</button>`).join('')}</div>
<div class="row"><button class="save" data-act="save" data-id="${it.id}">💾 SAVE</button><button class="copy" data-act="copy" data-id="${it.id}">📋 COPY</button></div>
<div class="out">${esc(state.out[it.id][t])}</div><div class="credit">Credit: ${esc(it.source)}</div>`}
function cardHTML(it){
const badge=it.busy?'<div class="ready busyb"><span class="spinner"></span>AI WRITING…</div>':(it.error?'<div class="ready errb">⚠ RETRY BELOW</div>':'<div class="ready"><span class="dot"></span>READY</div>');
return `<div class="card">${badge}<h3>${esc(it.title)}</h3>
<div class="meta">🕒 ${fmt(it.ts)} GMT • ${ago(it.ts)} • ${it.flag} ${it.country} • Source: ${esc(it.source)}${it.sample?' <span class="chipS">🧪 SAMPLE</span>':''}</div>
<div class="btns"><button class="gen" data-act="gen" data-id="${it.id}">⚡ GENERATE</button><button class="re" data-act="regen" data-id="${it.id}">⟳ REGENERATE</button></div>${state.out[it.id]?panelHTML(it):''}</div>`}
function render(){
document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===state.view));
const v=state.view;
if(v==='dash'){const l=state.arrived.filter(i=>state.region==='all'||i.region===state.region);
$('#view').innerHTML=`<div class="scanline">🛰 Window: last 60 min • auto-scan 90s • last scan: ${state.lastScan?fmt(state.lastScan)+' GMT':'—'}</div>`+(l.length?l.map(cardHTML).join(''):`<div class="empty">Scanning World • Africa • Nigeria…<br><br><button class="gen" data-act="refresh">🔄 FETCH NOW</button><br><br><button class="re" data-act="sample">🧪 LOAD SAMPLE BREAK</button></div>`);return}
if(v==='alerts'){$('#view').innerHTML=state.arrived.length?'<div class="grp">🔔 LIVE BREAKS — LAST 60 MIN</div>'+state.arrived.map(i=>`<div class="src"><span>🟢 ${esc(i.title)}</span><em>${fmt(i.ts)} • ${ago(i.ts)}</em></div>`).join(''):'<div class="empty">No alerts yet.</div>';return}
if(v==='sources'){$('#view').innerHTML=['world','africa','nigeria'].map(r=>`<div class="grp">${{world:'🌍 WORLD — 10',africa:'🌍 AFRICA — 10',nigeria:'🇳🇬 NIGERIA — 6'}[r]}</div>`+SOURCES[r].map(s=>`<div class="src"><span>${s}</span><em>MONITORED</em></div>`).join('')).join('');return}
if(v==='drafts'){$('#view').innerHTML=state.drafts.length?state.drafts.map((d,i)=>`<div class="card"><h3>${esc(d.title)}</h3><div class="meta">Saved ${d.ts} • Source: ${esc(d.source)}</div><div class="tabs">${TABS.map(([k,l])=>`<button class="tab" data-act="copyraw" data-i="${i}" data-t="${k}">📋 ${l}</button>`).join('')}</div></div>`).join(''):'<div class="empty">Nothing saved yet — hit 💾 on a generated story.</div>';return}
if(v==='set'){$('#view').innerHTML=`<div class="grp">⚙️ NEWSROOM SETTINGS</div>
<div class="set"><span>🔑 Grok API Key (stored only on this phone)</span></div>
<input id="keyInput" type="password" value="${esc(state.apiKey)}" placeholder="xai-..." style="max-width:none">
<button class="gen" style="width:100%" data-act="savekey">💾 SAVE KEY</button>
<div class="set" style="margin-top:10px"><span>🔔 Sound on new break</span><input type="checkbox" data-set="sound" ${state.sound?'checked':''} style="width:auto;margin:0"></div>
<div class="set"><span>👤 Logged in</span><em>${esc(state.user)} (${esc(state.role)})</em></div>
<button class="re" style="width:100%" data-act="logout">🚪 LOG OUT</button>
<div class="empty">Staff: 3 Admins • 2 Editors<br>AI: xAI Grok • Host: Vercel</div>`}}

/* ---- EVENTS ---- */
document.addEventListener('click',e=>{
const b=e.target.closest('[data-act]');if(!b)return;const d=b.dataset;
if(d.act==='login'){const u=$('#user').value.trim().toLowerCase(),p=$('#pin').value;
 if(USERS[u]&&USERS[u].pin===p){state.user=u;state.role=USERS[u].role;localStorage.setItem('drs_user',u);localStorage.setItem('drs_role',USERS[u].role);$('#login').style.display='none';start();}
 else toast('❌ Invalid username or PIN');return}
if(d.act==='nav'){state.view=d.v;render();return}
if(d.act==='refresh'){toast('🔄 Scanning live feeds…');checkFeeds();return}
if(d.act==='gen'){gen(d.id,false);return}
if(d.act==='regen'){gen(d.id,true);return}
if(d.act==='tab'){state.tab[d.id]=d.t;render();return}
if(d.act==='copy'){navigator.clipboard.writeText(state.out[d.id][state.tab[d.id]||'fb']).then(()=>toast('✅ Copied!'));return}
if(d.act==='copyraw'){navigator.clipboard.writeText(state.drafts[d.i].out[d.t]).then(()=>toast('✅ Copied!'));return}
if(d.act==='save'){const it=state.arrived.find(x=>x.id===d.id);state.drafts.unshift({title:it.title,source:it.source,ts:fmt(it.ts),out:state.out[it.id]});localStorage.setItem('drs_drafts',JSON.stringify(state.drafts));toast('💾 Saved to Drafts');render();return}
if(d.act==='savekey'){state.apiKey=$('#keyInput').value.trim();localStorage.setItem('drs_key',state.apiKey);toast('✅ Grok key saved on this phone');return}
if(d.act==='logout'){localStorage.removeItem('drs_user');localStorage.removeItem('drs_role');location.reload();return}
if(d.act==='sample'){loadSamples();return}
});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.set==='sound')state.sound=e.target.checked});
$('#region').addEventListener('change',e=>{state.region=e.target.value;render()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
let started=false;
function start(){if(started)return;started=true;render();checkFeeds();setInterval(checkFeeds,90000)}
if(state.user){$('#login').style.display='none';start()}
</script>
